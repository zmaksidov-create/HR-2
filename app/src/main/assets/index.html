<script>
const modules=[
["Профессия и кадровая функция","Роль кадровика, цикл трудовых отношений, взаимодействие с руководителями и работниками",[
["Роль специалиста отдела кадров","Кадровик обеспечивает документальное сопровождение трудовых отношений: от оформления приёма до прекращения договора. Он взаимодействует с руководителем, бухгалтерией, юристом и подразделениями.","Основные задачи: подготовка проектов документов; контроль сроков и полноты сведений; ведение кадрового учёта; хранение документов; консультация работников в пределах компетенции. Кадровик не подменяет руководителя и юриста: решения принимают уполномоченные лица, а спорные правовые вопросы передаются специалисту.","На собеседовании подчеркни аккуратность, конфиденциальность, системность и готовность сверять действия с законом."],
["Кадровый цикл и ответственность","Кадровый цикл — последовательность событий в трудовых отношениях: подбор, приём, адаптация, изменение условий, отпуск и другие отсутствия, прекращение договора, архивное хранение.","На каждом этапе проверь основание, полномочия подписанта, даты, согласования, ознакомление работника и регистрацию документа. Используй чек-листы, чтобы не пропускать шаги.","Принцип: сначала выяснить основание и проверить нормы, затем готовить документ, после этого регистрировать и хранить."],
["Этика, персональные данные и конфиденциальность","Кадровые документы часто содержат персональные данные. Доступ к ним должен предоставляться только тем, кому он необходим для работы и законно разрешён.","Не отправляй личные документы в личные мессенджеры без разрешённого порядка. Не оставляй личные дела открытыми на столе. Проверяй адресата перед отправкой. Не обсуждай зарплату, семейные обстоятельства и иные личные сведения посторонним.","При сомнении остановись и уточни у ответственного за защиту данных или руководителя установленный порядок."]
]],
["Трудовое законодательство Туркменистана","Как искать действующие нормы и применять Трудовой кодекс в ежедневной работе",[
["Система трудового законодательства","Работа кадровика опирается на Трудовой кодекс Туркменистана, другие нормативные правовые акты, коллективный договор (если действует), соглашения и локальные акты работодателя — в пределах их законности.","Перед применением нормы проверь актуальную редакцию, дату вступления изменений в силу и сферу действия. Не используй старый шаблон только потому, что он применялся раньше.","Официальный Центр правовой информации Министерства адалат: minjust.gov.tm/ru/hukuk/merkezi."],
["Как читать статью закона","Найди нужную главу и статью, прочитай весь пункт и связанные положения. Отдельно проверь исключения, сроки, специальные гарантии и переходные положения.","Составляй рабочую заметку: событие; применимая статья; необходимые документы; ответственный; срок; подтверждение ознакомления или вручения.","Не делай вывод по заголовку статьи или пересказу в интернете. При неоднозначности запроси юридическую проверку."],
["Права и обязанности сторон","Работник и работодатель имеют взаимные права и обязанности. Работодатель обеспечивает согласованные условия и оплату, работник выполняет трудовую функцию и соблюдает законные правила организации.","Кадровик должен корректно фиксировать согласованные условия и не включать в документы условия, противоречащие законодательству.","Не обещай работнику правовую гарантию, если не проверил норму и фактические обстоятельства."]
]],
["Приём на работу и трудовой договор","Проверка документов, согласование условий и оформление начала работы",[
["Подготовка к приёму","До оформления уточни: есть ли вакансия и штатная единица; кто уполномочен принять решение; какова должность; кто руководитель; место и режим работы; условия оплаты; дата начала.","Проверь документы, которые законно требуются для конкретной должности и ситуации. Не собирай лишние персональные сведения «на всякий случай».","Состав документов зависит от требований законодательства, характера работы и специальных условий."],
["Трудовой договор: содержание","Трудовой договор — соглашение работника и работодателя о трудовой функции, условиях труда, оплате и взаимных обязательствах. Это основной документ, фиксирующий договорённости сторон.","Сверяй ФИО и реквизиты сторон, должность, место работы, дату начала, срок (если договор срочный и для этого есть законное основание), оплату, режим и иные обязательные условия.","В Туркменистане базовые нормы о трудовом договоре находятся в разделе III Трудового кодекса. Проверь актуальные статьи перед подготовкой документа."],
["Оформление приёма: контрольный список","Уточнить основание и полномочия; получить и проверить необходимые документы; согласовать условия; подготовить договор и другие документы; обеспечить подписи; оформить распорядительный документ, если это предусмотрено действующим порядком; ознакомить с применимыми локальными актами; внести запись в учёт.","Следи за согласованностью дат во всех документах. Не проставляй подпись за работника и не оформляй документы задним числом.","Фактический допуск к работе может иметь правовые последствия. Если человек уже приступил к работе без полного оформления, немедленно сообщи руководителю и юристу, не пытайся скрыть ситуацию."]
]],
["Рабочее время, отдых и отпуска","Режимы работы, табель, выходные, ежегодные и иные отпуска",[
["Режим рабочего времени","Режим определяет распределение рабочего времени и отдыха: начало и окончание работы, перерывы, сменность, рабочую неделю и другие условия.","Сверяй режим в договоре, правилах внутреннего трудового распорядка и графиках. При суммированном учёте или сменной работе применяй специальные правила, утверждённые работодателем на законном основании.","Не переноси общие нормы на особые категории работников без проверки специальных гарантий."],
["Учёт рабочего времени и табель","Табель фиксирует фактически отработанное время и предусмотренные виды отсутствия. Данные табеля важны для расчётов и подтверждения соблюдения режима.","Определи, кто отвечает за первичные сведения, кто проверяет табель и кто утверждает его. Сверяй отметки с приказами, заявлениями и подтверждающими документами.","Не исправляй табель молча. Исправление должно быть объяснимым, подтверждённым и оформленным по внутреннему порядку."],
["Отпуска и отсутствие","Отпуск оформляется на основании применимых норм, графика (если предусмотрен), заявления или иного основания и распорядительного документа работодателя в установленном порядке.","Проверь право на отпуск, рабочий период, продолжительность, согласованные даты, остаток и необходимые согласования. После оформления передай сведения ответственным подразделениям.","Не рассчитывай продолжительность и компенсацию по памяти: проверь актуальную норму, категорию работника и локальные документы."]
]],
["Кадровые документы и делопроизводство","Приказы, заявления, личные дела, регистрация и хранение",[
["Приказы и распорядительные документы","Приказ фиксирует решение работодателя в пределах его полномочий: приём, перевод, отпуск, командировку, дисциплинарное взыскание или прекращение трудовых отношений.","Проверь основание, формулировку, ФИО, должность, даты, подразделение, ответственных и приложения. Убедись, что документ подписан уполномоченным лицом и доведён до работника, когда это требуется.","Не копируй формулировки из чужого приказа без проверки основания и применимой нормы."],
["Заявления, служебные записки и согласования","Заявление выражает просьбу работника; служебная записка сообщает служебную информацию; согласование подтверждает прохождение установленного маршрута.","Проверь дату, автора, адресата, содержание просьбы и наличие необходимых подтверждений. Регистрируй документы по принятой в организации системе.","Заявление само по себе не всегда означает, что просьба уже удовлетворена: проверь, требуется ли решение работодателя."],
["Личные дела и регистрация","Личное дело — упорядоченный комплект кадровых документов, состав которого определяется законодательством и внутренними правилами. Не включай документы без законной или служебной необходимости.","Используй опись или перечень, единые правила наименования, ограничение доступа, журнал или электронный реестр. Проверяй комплектность при движении документов.","Сроки хранения определяются применимыми архивными правилами и номенклатурой дел. Не уничтожай документы самостоятельно."]
]],
["Изменение и прекращение трудовых отношений","Перевод, изменение условий, дисциплинарные процедуры и увольнение",[
["Перевод и изменение условий","Изменение трудовой функции, подразделения, места или иных условий требует проверки правового основания и соблюдения предусмотренной процедуры.","Сначала выясни, является ли ситуация переводом, перемещением или изменением условий. Проверь необходимость согласия работника, письменного соглашения, уведомления и приказа.","Не считай устное поручение достаточным основанием для изменения условий договора."],
["Дисциплина и служебная проверка","При сообщении о нарушении сначала зафиксируй факты и документы. Дисциплинарная процедура должна соответствовать законодательству, срокам и гарантиям работника.","Не делай вывод о виновности заранее. Собери объяснения и подтверждения в установленном порядке, соблюдай сроки, конфиденциальность и полномочия участников.","Любое взыскание должно иметь законное основание и быть оформлено корректно. Сложные случаи согласуй с юристом."],
["Прекращение трудового договора","Увольнение может происходить по разным основаниям. Для каждого основания предусмотрены свои условия, документы, сроки и гарантии.","Проверь точное основание и волеизъявление сторон; документы и сроки; полномочия подписанта; правильность даты; ознакомление работника; расчёт и выдачу документов ответственными подразделениями.","Не используй универсальный шаблон увольнения. Ошибка в основании или процедуре может привести к спору и восстановлению работника."]
]],
["Практика кадровика и профессиональное развитие","Рабочие кейсы, взаимодействие с подразделениями и подготовка к собеседованию",[
["Взаимодействие с бухгалтерией и руководителями","Кадровик передаёт бухгалтерии подтверждённые сведения о приёме, переводах, отпусках и увольнениях. Руководители подразделений сообщают кадровые события и согласуют действия в рамках полномочий.","Согласуй сроки передачи документов, единый формат сведений и порядок исправления ошибок. Не передавай неподтверждённые данные как окончательные.","Веди контрольный список незавершённых задач и фиксируй, кому и когда передан документ."],
["Типичные ошибки и самопроверка","Частые ошибки: несовпадающие даты, неверная должность, отсутствие основания, подпись неуполномоченного лица, пропущенное ознакомление, лишние персональные данные и отсутствие регистрации.","Перед завершением проверь документ по чек-листу: законность основания; полномочия; реквизиты; даты; приложения; подписи; ознакомление; регистрация; хранение.","Лучше остановить оформление и уточнить сомнение, чем создавать документ с ошибкой."],
["Подготовка к собеседованию","Работодатель оценивает понимание кадрового цикла, аккуратность, конфиденциальность, базовые знания трудового законодательства и умение действовать по процедуре.","Если не знаешь точный ответ, честно обозначь, что проверишь действующую норму и согласуешь спорный вопрос. Приведи логичный алгоритм действий вместо догадки.","Подготовь примеры: как оформил бы приём, отпуск, перевод, увольнение; как обнаружил и исправил ошибку; как защитил персональные данные."]
]]
];
const quizBank=[
["Что является основой возникновения трудовых отношений?",["Только устная договорённость","Трудовой договор и предусмотренные законом случаи фактического допуска","График отпусков"],1,"Трудовой кодекс определяет трудовой договор как основание трудовых отношений; учитываются и предусмотренные законом случаи фактического допуска."],
["Кто подписывает приказ от имени работодателя?",["Любой сотрудник кадров","Уполномоченное лицо","Новый работник вместо работодателя"],1,"Документы подписывает лицо, имеющее соответствующие полномочия."],
["Что нужно проверить до оформления приёма?",["Только цвет копии паспорта","Основание, штатную потребность, условия и необходимые документы","Только устное обещание руководителя"],1,"Оформление начинается с проверки основания, полномочий и условий."],
["Для чего нужен табель?",["Для учёта рабочего времени","Для оценки характера","Для хранения дипломов"],0,"Табель отражает сведения об использовании рабочего времени."],
["Как обращаться с персональными данными?",["Передавать всем коллегам","Ограничивать доступ и использовать только по законной цели","Публиковать в общем чате"],1,"Доступ должен быть ограничен служебной необходимостью и законом."],
["Что делать, если норма закона вызывает сомнение?",["Догадаться","Проверить актуальную редакцию и при необходимости обратиться к юристу","Использовать старый шаблон"],1,"Нужно проверить официальный текст и связанные нормы."],
["Что фиксирует штатное расписание?",["Состав должностей и штатных единиц","Ежедневное настроение сотрудников","Только график отпусков"],0,"Штатное расписание отражает структуру должностей и единиц."],
["Заявление работника всегда означает автоматическое удовлетворение просьбы?",["Да, всегда","Нет, может требоваться решение или оформление работодателя","Заявление не имеет значения"],1,"Нужно проверить процедуру для конкретного вида просьбы."],

const interviews=[

function getDone(){try{return JSON.parse(localStorage.doneLessons||"[]")}catch(e){return []}}
function markDone(id){let d=getDone();if(!d.includes(id))d.push(id);localStorage.doneLessons=JSON.stringify(d);lesson(id)}
function setNav(id){document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));let el=document.getElementById("nav"+id);if(el)el.classList.add("active")}
function shell(s){document.getElementById("app").innerHTML=s;window.scrollTo(0,0)}
function home(){setNav("home");let d=getDone(),pct=Math.round(d.length/21*100);shell(`<div class="progressbox"><div class="row"><b>Твой прогресс</b><b>${d.length}/21 уроков</b></div><div class="bar"><div class="fill" style="width:${pct}%"></div></div><p class="muted">Завершено ${pct}% программы. Прогресс хранится на этом устройстве.</p><button onclick="catalog()">Продолжить обучение →</button></div><div class="title">Учебный центр</div><div class="grid"><div class="tile" onclick="catalog()"><div class="ico">📚</div><b>21 урок</b><small>7 модулей от основ до практики</small></div><div class="tile" onclick="exam()"><div class="ico">📝</div><b>Экзамен</b><small>20 вопросов с объяснениями</small></div><div class="tile" onclick="templates()"><div class="ico">📁</div><b>Документы</b><small>Учебные шаблоны и чек-листы</small></div><div class="tile" onclick="interview()"><div class="ico">🎓</div><b>Собеседование</b><small>Вопросы и подсказки</small></div></div><div class="title">Программа курса</div>${modules.map((m,i)=>`<div class="card"><div class="row"><b>${i+1}. ${m[0]}</b><span class="pill">${m[2].length} урока</span></div><p class="muted">${m[1]}</p><button class="secondary" onclick="modulePage(${i})">Открыть модуль</button></div>`).join("")}<div class="warn">Учебный курс не заменяет консультацию юриста и официальные тексты законов. Перед реальным кадровым действием проверяй актуальную редакцию норм.</div>`)}
function catalog(){setNav("lessons");home();document.getElementById("app").scrollIntoView()}
function modulePage(i){setNav("lessons");let m=modules[i],d=getDone();shell(`<button class="back" onclick="home()">← Главная</button><span class="pill">МОДУЛЬ ${i+1} ИЗ 7</span><h2>${m[0]}</h2><p class="muted">${m[1]}</p>${m[2].map((l,j)=>{let id=i*3+j;return `<div class="card"><div class="row"><b>${j+1}. ${l[0]}</b><span>${d.includes(id)?"✓":"›"}</span></div><p class="muted">${l[1]}</p><button class="secondary" onclick="lesson(${id})">Изучить урок</button></div>`}).join("")}`)}
function lesson(id){setNav("lessons");let mi=Math.floor(id/3),li=id%3,l=modules[mi][2][li],done=getDone().includes(id);shell(`<button class="back" onclick="modulePage(${mi})">← К модулю</button><span class="pill">МОДУЛЬ ${mi+1} • УРОК ${li+1}</span><h2>${l[0]}</h2><div class="card lesson"><h3>Ключевая идея</h3><p>${l[1]}</p><h3>Разберём подробнее</h3><p>${l[2]}</p><div class="note"><b>Практический ориентир</b><br>${l[3]}</div><h3>Мини-чек-лист</h3><ul><li>Определи событие и основание.</li><li>Проверь актуальную норму и внутренний порядок.</li><li>Уточни полномочия и необходимые согласования.</li><li>Проверь реквизиты, даты, подписи и регистрацию.</li><li>Обеспечь правильное хранение и ограничение доступа.</li></ul><button onclick="markDone(${id})">${done?"Урок пройден ✓":"Отметить урок пройденным"}</button></div><button class="secondary" onclick="modulePage(${mi})">К списку уроков</button>`)}
function exam(){setNav("exam");let qs=[...quizBank].sort(()=>Math.random()-.5).slice(0,10);window.examQs=qs;shell(`<button class="back" onclick="home()">← Главная</button><h2>Промежуточный экзамен</h2><p class="muted">10 случайных вопросов из банка. Выбери один вариант в каждом вопросе.</p><form id="examform">${qs.map((q,i)=>`<div class="card q"><b>${i+1}. ${q[0]}</b>${q[1].map((o,j)=>`<label class="option"><input type="radio" name="e${i}" value="${j}">${o}</label>`).join("")}<div id="ee${i}"></div></div>`).join("")}<button type="button" onclick="gradeExam()">Завершить экзамен</button></form><div id="examresult"></div>`)}
function gradeExam(){let qs=window.examQs,n=0,ans=0;qs.forEach((q,i)=>{let v=document.querySelector(`input[name=e${i}]:checked`),el=document.getElementById("ee"+i);if(v){ans++;if(+v.value===q[2])n++;el.innerHTML=`<p class="muted">${+v.value===q[2]?"✓ Верно. ":"✗ Неверно. "}${q[3]}</p>`}else el.innerHTML='<p class="muted">Нет ответа.</p>'});if(ans<qs.length){document.getElementById("examresult").innerHTML='<div class="card">Ответь на все вопросы.</div>';return}let old=+(localStorage.bestScore||0);if(n>old)localStorage.bestScore=n;document.getElementById("examresult").innerHTML=`<div class="card"><h2>Результат: ${n}/10</h2><p>${n>=8?"Хороший результат!":"Повтори материалы и попробуй снова."}</p><p class="muted">Лучший результат: ${localStorage.bestScore||n}/10</p><button onclick="exam()">Новый вариант</button></div>`}
function templates(){setNav("docs");shell(`<button class="back" onclick="home()">← Главная</button><h2>Справочник и учебные шаблоны</h2><p class="muted">Примеры структуры документов для обучения. Не являются утверждёнными формами и требуют проверки юристом и работодателем.</p><div class="card"><b>1. Заявление о приёме на работу</b><p class="muted">Адресат; ФИО заявителя; просьба принять на конкретную должность с указанной даты; дата; подпись.</p><button class="smallbtn secondary" onclick="copyText('Руководителю __________________\\nот __________________________\\n\\nЗАЯВЛЕНИЕ\\nПрошу принять меня на работу на должность __________________ с «___» ______ 20__ г.\\n\\nДата: __________ Подпись: __________')">Копировать образец</button></div><div class="card"><b>2. Каркас трудового договора</b><p class="muted">Стороны и реквизиты; трудовая функция; место работы; дата начала; срок и основание срочности (если применимо); условия оплаты; режим и отдых; права и обязанности; гарантии; подписи.</p><button class="smallbtn secondary" onclick="copyText('ТРУДОВОЙ ДОГОВОР № ____\\nДата и место: __________________\\nРаботодатель: __________________\\nРаботник: ______________________\\nТрудовая функция/должность: ______\\nМесто работы: __________________\\nДата начала: ____________________\\nСрок и основание (если срочный): __\\nУсловия оплаты: _________________\\nРежим труда и отдыха: ____________\\nПрава и обязанности сторон: ______\\nПодписи сторон: _________________')">Копировать структуру</button></div><div class="card"><b>3. Каркас приказа</b><p class="muted">Наименование организации; название и дата; номер; заголовок; распорядительная часть; основание; подпись уполномоченного лица; ознакомление, если требуется.</p><button class="smallbtn secondary" onclick="copyText('Наименование организации\\nПРИКАЗ № ____\\nДата: __________ Место: __________\\nО ______________________________\\nПРИКАЗЫВАЮ:\\n1. ______________________________\\nОснование: ______________________\\nПодпись уполномоченного лица: ____\\nС приказом ознакомлен(а): ________')">Копировать структуру</button></div><div class="card"><b>4. Чек-лист приёма</b><ul class="muted"><li>Подтверждено основание и наличие вакансии.</li><li>Установлены полномочия принимающего лица.</li><li>Проверены необходимые документы.</li><li>Условия согласованы и отражены в договоре.</li><li>Документы подписаны и зарегистрированы.</li><li>Проведено ознакомление с применимыми правилами.</li><li>Сведения внесены в кадровый учёт.</li></ul></div><div class="card"><b>5. Чек-лист отпуска</b><ul class="muted"><li>Проверено право и остаток отпуска.</li><li>Установлено основание и даты.</li><li>Получены необходимые согласования.</li><li>Оформлен распорядительный документ.</li><li>Сведения переданы бухгалтерии и внесены в учёт.</li></ul></div><div class="card"><b>6. Чек-лист увольнения</b><ul class="muted"><li>Проверено точное законное основание.</li><li>Проверены сроки и гарантии.</li><li>Подготовлены документы и проект приказа.</li><li>Проверены дата и расчётные сведения.</li><li>Оформлены ознакомление, выдача документов и хранение.</li></ul></div>`)}
function copyText(t){if(navigator.clipboard){navigator.clipboard.writeText(t).then(()=>alert("Текст скопирован"))}else{alert(t)}}
function interview(){setNav("interview");shell(`<button class="back" onclick="home()">← Главная</button><h2>Тренажёр собеседования</h2><p class="muted">Подготовь собственный ответ, затем открой подсказку.</p>${interviews.map((q,i)=>`<div class="card"><b>${i+1}. ${q[0]}</b><p><textarea class="field" rows="3" placeholder="Напиши свой ответ..."></textarea></p><button class="secondary smallbtn" onclick="this.nextElementSibling.hidden=!this.nextElementSibling.hidden">Показать ориентир ответа</button><p class="muted" hidden>${q[1]}</p></div>`).join("")}<div class="note">Совет: не заучивай ответы дословно. Используй структуру и объясняй ход своих действий.</div>`)}
home();
</script></main></body></html>
